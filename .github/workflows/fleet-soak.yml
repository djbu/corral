name: fleet-soak

on:
  schedule:
    - cron: "30 8 * * *" # nightly, after contract-real
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    # 1,000 spawn/kill cycles exercise process startup, durable checkpointing
    # and resume. On hosted runners this routinely takes longer than 30
    # minutes, so a shorter job budget would turn the M9 gate into a
    # guaranteed timeout rather than a leak-detection signal.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true

      - name: Run M9 fleet soak
        run: scripts/soak/fleet-soak.sh

      - name: Upload soak artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m9-fleet-soak-${{ github.run_id }}
          path: .soak-artifacts
          if-no-files-found: warn
